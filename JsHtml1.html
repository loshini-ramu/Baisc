<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="email" onchange="changeText()" type="text">
    <input id="password" onchange="changeText()" type="text">
    <button id="btn" onclick="handleClick()">Submit</button>

    <!-- API = http://localhost:8080/api/user/login Application Programming Interface -->
    <!-- HTTP Mrthods GET POST PUT DELETE -->
    <!-- 200 201 400 401 404 500 503 status code -->

    <script>
        let isvalid=false;
        function handleClick(){
            if(isvalid){
                alert("Username & pass is valid");
            }else{
                alert("Username & pass is not valid");
            }
        }

        function changeText(){
            let email=document.getElementById("email").value;
            let password=document.getElementById("password").value;
            let emailvalid= email.includes("@");
            let passwordvalid= password.length>8 && !password.includes("@");
            console.log("email",emailvalid);
            console.log("password",passwordvalid);
            isvalid=(emailvalid && passwordvalid); 
        }

    </script>

    
</body>
</html>
