<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Login Form</h1>
    <input id="email" onchange="condition()" placeholder="Email" type="text"><br>
    <input id="password" onchange="condition()" placeholder="Password" type="text"><br>
    <button id="btn" onclick="alerts()">Submit</button>

    <script>
        let isvalid = false
        function alerts(){
            if(isvalid){
                alert("Successfully Logged in ");
            }else{
                alert("Ensure the Email & Password");
            }
        }
        function condition(){
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let emailvalidate = email.includes("@");
            let passwordvalidate = password.length>8;
            console.log("Email :",emailvalidate);
            console.log("Password :",passwordvalidate);
            isvalid=(emailvalidate && passwordvalidate);

        }
    </script>
    
</body>
</html>
