<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .c{
         color:yellow;
    }
</style>
<body>
    <button id="btn1" onclick="getAPI()">Click me</button> 
    <div id="d1"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function getAPI(){
         fetch("https://jsonplaceholder.typicode.com/users").
         then((res)=>res.json()).then((re)=>{
            console.log(re);

            for(let i=0;i<re.length;i++){
                let newPtag  = document.createElement("p");
                newPtag.innerHTML = '<span style="color: blue;">Full Name - </span>' + re[i].name + '<span style="color: blue;">; Email; - </span> ' + re[i].email;
                document.getElementById("d1").append(newPtag);
            }
         })
        }

    </script>
</body>
</html>
